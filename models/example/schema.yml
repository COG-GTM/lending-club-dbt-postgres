# The schema below defines the loans model
# Definition of dimensions, metrics, types, and numbers are done here
# Read more about dbt <> Lightdash metrics here https://docs.lightdash.com/references/metrics/
# Read more about dbt <> Lightdash dimensions here https://docs.lightdash.com/references/dimensions
#
# DATA-QUALITY CONTROL SET
# Every test below carries an explicit control ID (dq_NN_...). The control
# register - what each control asserts, the SQL an auditor can re-run, and the
# before/after result with row counts - is docs/loan-data-qc-evidence.md.
# Raw-layer controls (DQ-04, DQ-05) are declared in sources.yml.

version: 2
models:
  - name: my_loans_model
    description: >-
      Loan-level analytical model, one row per loan listing. Carries the
      loan-level data-quality control set documented in
      docs/loan-data-qc-evidence.md.
    tests:
      # CONTROL DQ-06: row-count parity between the raw extract and the
      # transformed model - the transformation must neither drop nor duplicate
      # loans.
      - dbt_utils.equal_rowcount:
          name: dq_06_row_count_parity_raw_vs_model
          compare_model: source('lending_club', 'loans')
    columns:
      - name: loan_id
        description: >-
          A unique LC assigned ID for the loan listing. This is the true loan
          key and the only identifier that may be used to join this model
          downstream. It is sourced from the raw column "id"; the semantic
          layer previously declared the key as "loan_id_broken" (see DQ-03).
        tests:
          # CONTROL DQ-01: the loan key is unique - no double-counted loans.
          - unique:
              name: dq_01_loan_key_is_unique
          # CONTROL DQ-02: the loan key is complete - no unidentifiable loans.
          - not_null:
              name: dq_02_loan_key_is_not_null
        meta:
          dimension:
            label: loan id
            type: number
          metrics:
            number_of_loans:
              type: count
            number_of_unique_loans:
              type: count_distinct
      - name: loan_id_broken
        description: >-
          QUARANTINED - DO NOT USE. Legacy key column name introduced in commit
          3addfa7 ("Data quality check update"), which renamed the tested key
          from "id" to "loan_id_broken". No such column exists in the raw
          extract or in the warehouse, so the uniqueness and not-null controls
          bound to it could not execute and the loan key was effectively
          uncontrolled. The name is retained here, forced to NULL and hidden
          from BI, so the defect stays visible in lineage and any consumer
          still joining on it fails loudly instead of silently. The
          authoritative key is loan_id.
        tests:
          # CONTROL DQ-03: the quarantined key is inert - 100% NULL, so it
          # cannot be used as a join key or a count_distinct grain.
          - dbt_utils.expression_is_true:
              name: dq_03_quarantined_key_is_inert
              expression: "is null"
        meta:
          dimension:
            type: number
            hidden: true
      - name: member_id
        description: A unique LC assigned ID for the borrower member.
        tests:
          # CONTROL DQ-24: borrower key is unique and complete.
          - unique:
              name: dq_24_member_key_is_unique
          - not_null:
              name: dq_24_member_key_is_not_null
        meta:
          dimension:
            type: string
          metrics:
            number_of_clients:
              type: count
            number_of_unique_clients:
              type: count_distinct
      - name: loan_amnt
        description: >-
          The listed amount of the loan applied for by the borrower. If at some
          point in time, the credit department reduces the loan amount, then it
          will be reflected in this value.
        tests:
          # CONTROL DQ-15: every loan carries a non-negative, plausible
          # principal. LC personal loans are issued between $500 and $35,000;
          # the bound is set at $40,000 to allow for product change.
          - not_null:
              name: dq_15_loan_amount_is_not_null
          - dbt_utils.accepted_range:
              name: dq_15_loan_amount_in_plausible_range
              min_value: 500
              max_value: 40000
              inclusive: true
        meta:
          dimension:
            label: loan amount
            type: number
          metrics:
            total_loan_amnt:
              label: total loan amount
              description: >-
                The listed total amount of the loan applied for by the borrower.
                If at some point in time, the credit department reduces the loan
                amount, then it will be reflected in this value.
              type: sum
      - name: funded_amnt
        description: The total amount committed to that loan at that point in time.
        tests:
          # CONTROL DQ-16: funded amount is non-negative and can never exceed
          # the amount applied for.
          - not_null:
              name: dq_16_funded_amount_is_not_null
          - dbt_utils.accepted_range:
              name: dq_16_funded_amount_is_non_negative
              min_value: 0
              inclusive: true
          - dbt_utils.expression_is_true:
              name: dq_16_funded_amount_not_above_loan_amount
              expression: "<= loan_amnt"
        meta:
          dimension:
            type: number
          metrics:
            total_funded_amnt:
              type: sum
      - name: funded_amnt_inv
        description: >-
          The total amount committed by investors for that loan at that point in
          time.
        tests:
          # CONTROL DQ-17: the investor-funded portion is non-negative and
          # cannot exceed the total funded amount.
          - dbt_utils.accepted_range:
              name: dq_17_investor_funded_amount_is_non_negative
              min_value: 0
              inclusive: true
          - dbt_utils.expression_is_true:
              name: dq_17_investor_funded_not_above_funded_amount
              expression: "<= funded_amnt"
        meta:
          dimension:
            type: number
          metrics:
            total_funded_amnt_inv:
              type: sum
      - name: term
        description: >-
          The number of payments on the loan. Values are in months and can be
          either 36 or 60.
        tests:
          # CONTROL DQ-13: term is one of the two contractual products.
          - accepted_values:
              name: dq_13_term_is_a_valid_product
              values: ["36 months", "60 months"]
        meta:
          dimension:
            type: string
      - name: term_months
        description: Loan term parsed to an integer number of months.
        tests:
          # CONTROL DQ-13: parsed term matches the contractual products.
          - not_null:
              name: dq_13_term_months_is_not_null
          - accepted_values:
              name: dq_13_term_months_is_36_or_60
              values: [36, 60]
              quote: false
        meta:
          dimension:
            type: number
      - name: int_rate
        description: Interest Rate on the loan.
        meta:
          dimension:
            type: string
      - name: installment
        description: The monthly payment owed by the borrower if the loan originates.
        tests:
          # CONTROL DQ-18: the monthly instalment is strictly positive and
          # within a plausible ceiling for a $40k / 36-month product.
          - not_null:
              name: dq_18_installment_is_not_null
          - dbt_utils.accepted_range:
              name: dq_18_installment_in_plausible_range
              min_value: 0
              max_value: 2000
              inclusive: false
        meta:
          dimension:
            type: number
          metrics:
            total_installment:
              type: sum
      - name: grade
        description: LC assigned loan grade.
        tests:
          # CONTROL DQ-09: credit grade is on the published A-G scale.
          - not_null:
              name: dq_09_grade_is_not_null
          - accepted_values:
              name: dq_09_grade_is_on_published_scale
              values: ["A", "B", "C", "D", "E", "F", "G"]
        meta:
          dimension:
            type: string
      - name: sub_grade
        description: LC assigned loan subgrade.
        meta:
          dimension:
            type: string
      - name: emp_title
        description: The job title supplied by the Borrower when applying for the loan.
        meta:
          dimension:
            type: string
      - name: emp_length
        description: >-
          Employment length in years. Possible values are between 0 and 10 where
          0 means less than one year and 10 means ten or more years.
        meta:
          dimension:
            type: string
      - name: home_ownership
        description: >-
          The home ownership status provided by the borrower during
          registration. Values observed in this extract are RENT, OWN,
          MORTGAGE, OTHER and NONE.
        tests:
          # CONTROL DQ-11: home ownership is a known category.
          - accepted_values:
              name: dq_11_home_ownership_is_a_known_category
              values: ["RENT", "OWN", "MORTGAGE", "OTHER", "NONE"]
        meta:
          dimension:
            type: string
      - name: annual_inc
        description: >-
          The self-reported annual income provided by the borrower during
          registration.
        tests:
          # CONTROL DQ-20: self-reported income is non-negative and within a
          # plausible ceiling (max observed $6,000,000).
          - dbt_utils.accepted_range:
              name: dq_20_annual_income_in_plausible_range
              min_value: 0
              max_value: 10000000
              inclusive: true
        meta:
          dimension:
            type: number
          metrics:
            total_annual_inc:
              type: sum
      - name: verification_status
        description: >-
          Indicates if income was verified by LC, not verified, or if the income
          source was verified.
        tests:
          # CONTROL DQ-12: income verification status is a known category.
          - accepted_values:
              name: dq_12_verification_status_is_a_known_category
              values: ["Verified", "Source Verified", "Not Verified"]
        meta:
          dimension:
            type: string
      - name: issue_d
        description: The month which the loan was funded.
        meta:
          dimension:
            type: string
      - name: loan_status
        description: Current status of the loan.
        tests:
          # CONTROL DQ-08: loan status is one of the recognised lifecycle
          # states - an unrecognised state would misstate the loss provision.
          - not_null:
              name: dq_08_loan_status_is_not_null
          - accepted_values:
              name: dq_08_loan_status_is_a_known_state
              values: ["Current", "Fully Paid", "Charged Off"]
        meta:
          dimension:
            type: string
      - name: pymnt_plan
        description: Indicates if a payment plan has been put in place for the loan.
        meta:
          dimension:
            type: string
      - name: url
        description: URL for the LC page with listing data.
        meta:
          dimension:
            type: string
      - name: description
        description: Loan description provided by the borrower.
        meta:
          dimension:
            type: string
      - name: purpose
        description: A category provided by the borrower for the loan request.
        tests:
          # CONTROL DQ-14: loan purpose is a known category.
          - accepted_values:
              name: dq_14_purpose_is_a_known_category
              values:
                [
                  "car",
                  "credit_card",
                  "debt_consolidation",
                  "educational",
                  "home_improvement",
                  "house",
                  "major_purchase",
                  "medical",
                  "moving",
                  "other",
                  "renewable_energy",
                  "small_business",
                  "vacation",
                  "wedding",
                ]
        meta:
          dimension:
            type: string
      - name: title
        description: The loan title provided by the borrower.
        meta:
          dimension:
            type: string
      - name: zip_code
        description: >-
          The first 3 numbers of the zip code provided by the borrower in the
          loan application.
        meta:
          dimension:
            type: string
      - name: addr_state
        description: The state provided by the borrower in the loan application.
        meta:
          dimension:
            type: string
      - name: dti
        description: >-
          A ratio calculated using the borrower’s total monthly debt payments on
          the total debt obligations, excluding mortgage and the requested LC
          loan, divided by the borrower’s self-reported monthly income.
        tests:
          # CONTROL DQ-21: debt-to-income ratio is a percentage between 0 and
          # 100 - a value outside this band indicates a unit or scaling defect.
          - dbt_utils.accepted_range:
              name: dq_21_dti_is_a_valid_percentage
              min_value: 0
              max_value: 100
              inclusive: true
        meta:
          dimension:
            type: number
      - name: delinq_2yrs
        description: >-
          The number of 30+ days past-due incidences of delinquency in the
          borrower's credit file for the past 2 years.
        meta:
          dimension:
            type: number
          metrics:
            total_delinq_2yrs:
              type: sum
      - name: earliest_cr_line
        description: The month the borrower's earliest reported credit line was opened.
        meta:
          dimension:
            type: string
      - name: inq_last_6mths
        description: >-
          The number of inquiries in the past 6 months (excluding auto and
          mortgage inquiries).
        meta:
          dimension:
            type: number
          metrics:
            total_inq_last_6mths:
              type: sum
      - name: mths_since_last_delinq
        description: The number of months since the borrower's last delinquency."
        meta:
          dimension:
            type: string
      - name: mths_since_last_record
        description: The number of months since the last public record.
        meta:
          dimension:
            type: string
      - name: open_acc
        description: The number of open credit lines in the borrower's credit file.
        meta:
          dimension:
            type: number
          metrics:
            total_open_acc:
              type: sum
      - name: pub_rec
        description: Number of derogatory public records.
        meta:
          dimension:
            type: number
          metrics:
            total_pub_rec:
              type: sum
      - name: revol_bal
        description: Total credit revolving balance.
        meta:
          dimension:
            type: number
          metrics:
            total_revol_bal:
              type: sum
      - name: revol_util
        description: >-
          Revolving line utilization rate, or the amount of credit the borrower
          is using relative to all available revolving credit. Held as the raw
          percentage string; see revol_util_pct for the numeric form.
        meta:
          dimension:
            type: string
      - name: revol_util_pct
        description: Revolving line utilization rate parsed to a numeric percentage.
        tests:
          # CONTROL DQ-22: utilisation is a percentage between 0 and 200 -
          # over-limit accounts can exceed 100 but not by an order of magnitude.
          - dbt_utils.accepted_range:
              name: dq_22_revolving_utilisation_in_plausible_range
              min_value: 0
              max_value: 200
              inclusive: true
        meta:
          dimension:
            type: number
      - name: total_acc
        description: >-
          The total number of credit lines currently in the borrower's credit
          file.
        meta:
          dimension:
            type: number
          metrics:
            sum_total_acc:
              type: sum
      - name: initial_list_status
        description: The initial listing status of the loan. Possible values are – W, F.
        meta:
          dimension:
            type: string
      - name: out_prncp
        description: Remaining outstanding principal for total amount funded.
        tests:
          # CONTROL DQ-23: outstanding principal can never be negative.
          - dbt_utils.accepted_range:
              name: dq_23_outstanding_principal_is_non_negative
              min_value: 0
              inclusive: true
        meta:
          dimension:
            type: number
          metrics:
            total_out_prncp:
              type: sum
      - name: out_prncp_inv
        description: >-
          Remaining outstanding principal for portion of total amount funded by
          investors.
        meta:
          dimension:
            type: number
          metrics:
            total_out_prncp_inv:
              type: sum
      - name: total_pymnt
        description: Payments received to date for total amount funded.
        tests:
          # CONTROL DQ-23: cash amounts received can never be negative.
          - dbt_utils.accepted_range:
              name: dq_23_total_payment_is_non_negative
              min_value: 0
              inclusive: true
        meta:
          dimension:
            type: number
          metrics:
            sum_total_pymnt:
              type: sum
      - name: total_pymnt_inv
        description: >-
          Payments received to date for portion of total amount funded by
          investors.
        meta:
          dimension:
            type: number
          metrics:
            total_total_pymnt_inv:
              type: sum
      - name: total_rec_prncp
        description: Principal received to date for total amount funded.
        tests:
          # CONTROL DQ-23: cash amounts received can never be negative.
          - dbt_utils.accepted_range:
              name: dq_23_principal_received_is_non_negative
              min_value: 0
              inclusive: true
        meta:
          dimension:
            type: number
      - name: total_rec_int
        description: Interest received to date for total amount funded.
        tests:
          # CONTROL DQ-23: cash amounts received can never be negative.
          - dbt_utils.accepted_range:
              name: dq_23_interest_received_is_non_negative
              min_value: 0
              inclusive: true
        meta:
          dimension:
            type: number
      - name: total_rec_late_fee
        description: Late fees received to date.
        meta:
          dimension:
            type: number
          metrics:
            sum_total_rec_late_fee:
              type: sum
      - name: recoveries
        description: post charge off gross recovery.
        tests:
          # CONTROL DQ-23: cash amounts received can never be negative.
          - dbt_utils.accepted_range:
              name: dq_23_recoveries_are_non_negative
              min_value: 0
              inclusive: true
        meta:
          dimension:
            type: number
          metrics:
            total_recoveries:
              type: sum
      - name: collection_recovery_fee
        description: post charge off collection fee.
        meta:
          dimension:
            type: number
          metrics:
            total_collection_recovery_fee:
              type: sum
      - name: last_pymnt_d
        description: Last month payment was received.
        meta:
          dimension:
            type: string
      - name: last_pymnt_amnt
        description: Last total payment amount received.
        meta:
          dimension:
            type: number
          metrics:
            total_last_pymnt_amnt:
              type: sum
      - name: next_pymnt_d
        description: Next scheduled payment date.
        meta:
          dimension:
            type: string
      - name: last_credit_pull_d
        description: The most recent month LC pulled credit for this loan.
        meta:
          dimension:
            type: string
      - name: collections_12_mths_ex_med
        description: Number of collections in 12 months excluding medical collections.
        meta:
          dimension:
            type: number
          metrics:
            total_collections_12_mths_ex_med:
              type: sum
      - name: policy_code
        description: >-
          Publicly available policy_code=1. New products not publicly available
          policy_code=2.
        meta:
          dimension:
            type: number
      - name: application_type
        description: >-
          Indicates whether the loan is an individual application or a joint
          application with two co-borrowers.
        meta:
          dimension:
            type: string
      - name: acc_now_delinq
        description: The number of accounts on which the borrower is now delinquent.
        meta:
          dimension:
            type: number
          metrics:
            total_acc_now_delinq:
              type: sum
      - name: tot_coll_amt
        description: Total collection amounts ever owed.
        meta:
          dimension:
            type: number
          metrics:
            sum_tot_coll_amt:
              type: sum
      - name: tot_cur_bal
        description: Total current balance of all accounts.
        meta:
          dimension:
            type: number
          metrics:
            sum_tot_cur_bal:
              type: sum
      - name: open_acc_6m
        description: Number of open trades in the last 6 months.
        meta:
          dimension:
            type: number
          metrics:
            total_open_acc_6m:
              type: sum
      - name: open_il_12m
        description: Number of installment accounts opened in past 12 months.
        meta:
          dimension:
            type: number
      - name: open_il_24m
        description: Number of installment accounts opened in past 24 months.
        meta:
          dimension:
            type: number
      - name: mths_since_rcnt_il
        description: Months since most recent installment accounts opened.
        meta:
          dimension:
            type: number
      - name: total_bal_il
        description: Total current balance of all installment accounts.
        meta:
          dimension:
            type: number
      - name: il_util
        description: >-
          Ratio of total current balance to high credit/credit limit on all
          install acct.
        meta:
          dimension:
            type: number
      - name: open_rv_12m
        description: Number of revolving trades opened in past 12 months.
        meta:
          dimension:
            type: number
      - name: open_rv_24m
        description: Number of revolving trades opened in past 24 months.
        meta:
          dimension:
            type: number
      - name: max_bal_bc
        description: Maximum current balance owed on all revolving accounts.
        meta:
          dimension:
            type: number
      - name: all_util
        description: Balance to credit limit on all trades.
        meta:
          dimension:
            type: number
      - name: total_rev_hi_lim
        description: Total revolving high credit/credit limit.
        meta:
          dimension:
            type: number
      - name: inq_fi
        description: Number of personal finance inquiries.
        meta:
          dimension:
            type: number
      - name: total_cu_tl
        description: Number of finance trades.
        meta:
          dimension:
            type: number
      - name: inq_last_12m
        description: Number of credit inquiries in past 12 months.
        meta:
          dimension:
            type: number
      - name: acc_open_past_24mths
        description: Number of trades opened in past 24 months.
        meta:
          dimension:
            type: number
      - name: avg_cur_bal
        description: Average current balance of all accounts.
        meta:
          dimension:
            type: number
      - name: bc_open_to_buy
        description: Total open to buy on revolving bankcards.
        meta:
          dimension:
            type: number
      - name: bc_util
        description: >-
          Ratio of total current balance to high credit/credit limit for all
          bankcard accounts.
        meta:
          dimension:
            type: number
      - name: chargeoff_within_12_mths
        description: Number of charge-offs within 12 months.
        meta:
          dimension:
            type: number
          metrics:
            total_chargeoff_within_12_mths:
              type: sum
      - name: delinq_amnt
        description: >-
          The past-due amount owed for the accounts on which the borrower is now
          delinquent.
        meta:
          dimension:
            type: string
      - name: mo_sin_old_il_acct
        description: Months since oldest installment account opened.
        meta:
          dimension:
            type: number
      - name: mo_sin_rcnt_rev_tl_op
        description: Months since most recent revolving account opened
        meta:
          dimension:
            type: string
      - name: mo_sin_rcnt_tl
        description: Months since most recent account opened
        meta:
          dimension:
            type: string
      - name: mort_acc
        description: Number of mortgage accounts
        meta:
          dimension:
            type: string
      - name: mths_since_recent_bc
        description: Months since most recent bankcard account opened
        meta:
          dimension:
            type: string
      - name: mths_since_recent_bc_dlq
        description: Months since most recent bankcard delinquency
        meta:
          dimension:
            type: string
      - name: mths_since_recent_inq
        description: Months since most recent inquiry
        meta:
          dimension:
            type: string
      - name: mths_since_recent_revol_delinq
        description: Months since most recent revolving delinquency
        meta:
          dimension:
            type: string
      - name: num_accts_ever_120_pd
        description: Number of accounts ever 120 or more days past due
        meta:
          dimension:
            type: string
      - name: num_actv_bc_tl
        description: Number of currently active bankcard accounts
        meta:
          dimension:
            type: string
      - name: num_actv_rev_tl
        description: Number of currently active revolving trades
        meta:
          dimension:
            type: string
      - name: num_bc_sats
        description: Number of satisfactory bankcard accounts
        meta:
          dimension:
            type: string
      - name: num_bc_tl
        description: Number of bankcard accounts
        meta:
          dimension:
            type: string
      - name: num_il_tl
        description: Number of installment accounts
        meta:
          dimension:
            type: string
      - name: num_op_rev_tl
        description: Number of open revolving accounts
        meta:
          dimension:
            type: string
      - name: num_rev_accts
        description: Number of revolving accounts
        meta:
          dimension:
            type: string
      - name: num_rev_tl_bal_gt_0
        description: Number of revolving trades with balance greater than zero
        meta:
          dimension:
            type: string
      - name: num_sats
        description: Number of satisfactory accounts
        meta:
          dimension:
            type: string
      - name: num_tl_120dpd_2m
        description: >-
          Number of accounts currently 120 days past due (updated in past 2
          months)
        meta:
          dimension:
            type: string
      - name: num_tl_30dpd
        description: >-
          Number of accounts currently 30 days past due (updated in past 2
          months)
        meta:
          dimension:
            type: string
      - name: num_tl_90g_dpd_24m
        description: Number of accounts 90 or more days past due in last 24 months
        meta:
          dimension:
            type: string
      - name: num_tl_op_past_12m
        description: Number of accounts opened in past 12 months
        meta:
          dimension:
            type: string
      - name: pct_tl_nvr_dlq
        description: Percent of trades never delinquent
        meta:
          dimension:
            type: string
      - name: percent_bc_gt_75
        description: Percentage of all bankcard accounts greater than 75% of limit
